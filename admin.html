<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TRANDIXO Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--blue:#2f78a8;--navy:#123b57;--sky:#e6f1f8;--bg:#f4f8fb;--card:#fff;--ink:#16293a;--mute:#6b7f8f;--line:#dbe6ee;--coral:#f0566a;--ok:#2e9d6b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Sora',system-ui,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{color:var(--blue);font-size:20px;font-weight:700;letter-spacing:.04em;padding:0 10px 18px}
.side button{background:none;text-align:left;padding:11px 14px;border-radius:12px;color:var(--mute);font-weight:500}
.side button.on,.side button:hover{background:var(--sky);color:var(--blue)}
.side .out{margin-top:auto}
main{margin-left:220px;padding:28px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}
.btn:hover{background:var(--navy)}
.btn.g{background:var(--sky);color:var(--blue)}
.btn.d{background:#fde8eb;color:var(--coral)}
.btn.s{padding:6px 12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.kpi small{color:var(--mute)}.kpi b{display:block;font-family:'Sora';font-size:24px;margin-top:2px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
.chart i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.th{width:44px;height:44px;border-radius:10px;background:var(--sky);object-fit:cover;display:block}
.pill{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--sky);color:var(--blue)}
.pill.off{background:#eee;color:#888}.pill.ok{background:#dff3ea;color:var(--ok)}
label{display:block;font-weight:500;font-size:13px;margin-bottom:12px}
input,select,textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}input[type=color]{padding:2px;height:40px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(18,59,87,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{width:100%;max-width:520px;max-height:92vh;overflow:auto;margin:0}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .box{width:100%;max-width:380px}
.err{color:var(--coral);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:90}
.bar{display:none}
@media (max-width:860px){
 .side{display:none}main{margin:0;padding:16px 14px 90px}
 .cards{grid-template-columns:1fr 1fr}.two,.f2{grid-template-columns:1fr}
 .bar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
 .bar button{flex:1;background:none;font-size:12px;color:var(--mute);padding:8px 0;font-weight:500}.bar button.on{color:var(--blue);font-weight:700}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),R=$('#root');
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAT=['Placed','Packed','Shipped','Delivered','Cancelled'];
let sb,S={p:[],o:[],s:{},r:[],v:'dash'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
const DEF={u:'https://ukwhqktdelanuqlbfckg.supabase.co',k:'sb_publishable_qTce_OToCZfoors1p1-xzA_4siEte5W'};
function cfg(){try{return JSON.parse(localStorage.getItem('tx_sb'))||DEF}catch(e){return DEF}}

function cfgScreen(){R.innerHTML=`<div class="auth"><div class="box"><h2 style="margin-bottom:6px">Connect Supabase</h2><p style="color:var(--mute);margin:0 0 14px">Supabase > Project Settings > API se Project URL aur anon public key copy karein.</p><label>Project URL<input id="u" placeholder="https://xxxx.supabase.co"></label><label>Anon public key<input id="k"></label><button class="btn" style="width:100%" onclick="saveCfg()">Save and continue</button></div></div>`}
function saveCfg(){const u=$('#u').value.trim(),k=$('#k').value.trim();if(!u||!k)return;localStorage.setItem('tx_sb',JSON.stringify({u,k}));init()}
function loginScreen(e){R.innerHTML=`<div class="auth"><div class="box"><div class="logo" style="padding:0 0 12px">TRANDIXO Admin</div><label>Email<input id="em" type="email" autocomplete="username"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><div class="err">${esc(e||'')}</div><button class="btn" style="width:100%" onclick="login()">Log in</button><p style="text-align:center;margin:14px 0 0"><button class="btn g s" onclick="localStorage.removeItem('tx_sb');init()">Change Supabase project</button></p></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?loginScreen(error.message):start()}
async function logout(){await sb.auth.signOut();loginScreen()}

async function init(){const c=cfg();if(!c)return cfgScreen();sb=supabase.createClient(c.u,c.k);const {data}=await sb.auth.getSession();data.session?start():loginScreen()}
async function load(){
 const [p,o,s,rv]=await Promise.all([sb.from('products').select('*').order('id'),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('settings').select('*'),sb.from('reviews').select('*').order('created_at',{ascending:false})]);
 const er=p.error||o.error||s.error;if(er)toast(er.message);
 S.r=rv.data||[];S.p=p.data||[];S.o=o.data||[];S.s=Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
}
async function start(){await load();draw()}
const TABS=[['dash','Dashboard'],['prod','Products'],['ord','Orders'],['rev','Reviews'],['look','Appearance']];
function draw(){
 const nav=TABS.map(([k,l])=>`<button class="${S.v==k?'on':''}" onclick="S.v='${k}';draw()">${l}</button>`).join('');
 const v={dash,prod,ord,rev,look}[S.v]();
 R.innerHTML=`<div class="side"><div class="logo">TRANDIXO</div>${nav}<button class="out" onclick="logout()">Log out</button></div><main>${v}</main><div class="bar">${nav}</div>`}

function dash(){
 const ok=S.o.filter(o=>o.status!='Cancelled'),rev=ok.reduce((a,o)=>a+Number(o.total),0),aov=ok.length?rev/ok.length:0;
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d.toDateString()});
 const byDay=days.map(d=>ok.filter(o=>new Date(o.created_at).toDateString()==d).reduce((a,o)=>a+Number(o.total),0)),mx=Math.max(...byDay,1);
 const tp={};ok.forEach(o=>(o.items||[]).forEach(i=>{const n=i.name||('Product #'+i.id);tp[n]=(tp[n]||0)+(i.q||1)}));
 const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const cnt=s=>S.o.filter(o=>o.status==s).length;
 return `<div class="top"><h1>Dashboard</h1><button class="btn g" onclick="start()">Refresh</button></div>
 <div class="cards"><div class="box kpi"><small>Revenue</small><b>${inr(rev)}</b></div><div class="box kpi"><small>Orders</small><b>${S.o.length}</b></div><div class="box kpi"><small>Avg order value</small><b>${inr(aov)}</b></div><div class="box kpi"><small>Pending (Placed)</small><b>${cnt('Placed')}</b></div></div>
 <div class="two"><div class="box"><h3>Revenue, last 14 days</h3><div class="chart">${byDay.map((v,i)=>`<div title="${inr(v)}"><i style="height:${v/mx*100}%"></i>${new Date(days[i]).getDate()}</div>`).join('')}</div></div>
 <div class="box"><h3 style="margin-bottom:8px">Top products</h3>${top.length?top.map(([n,q])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><span>${esc(n)}</span><b>${q} sold</b></div>`).join(''):'<p style="color:var(--mute)">No sales yet.</p>'}
 <h3 style="margin:16px 0 8px">Order status</h3>${STAT.map(s=>`<div style="display:flex;justify-content:space-between"><span>${s}</span><b>${cnt(s)}</b></div>`).join('')}</div></div>`}

function prod(){return `<div class="top"><h1>Products (${S.p.length})</h1><button class="btn" onclick="pform()">Add product</button></div><div class="box tw"><table><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>${S.p.map(p=>`<tr><td>${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="">`:`<div class="th" style="background:${esc((p.colors||[])[0]||'#2f78a8')}"></div>`}</td><td><b>${esc(p.name)}</b><br><small style="color:var(--mute)">${esc(p.category)}</small></td><td>${inr(p.price)}</td><td>${p.stock}</td><td><span class="pill ${p.active?'ok':'off'}">${p.active?'Live':'Hidden'}</span></td><td style="white-space:nowrap"><button class="btn g s" onclick="pform(${p.id})">Edit</button> <button class="btn g s" onclick="tog(${p.id})">${p.active?'Hide':'Show'}</button> <button class="btn d s" onclick="del(${p.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mute)">No products yet. Add your first tote.</td></tr>'}</table></div>`}
function pform(id){const p=S.p.find(x=>x.id==id)||{active:true,colors:['#2f78a8'],category:'Canvas',stock:10};
 const m=document.createElement('div');m.className='modal';m.id='md';
 m.innerHTML=`<div class="box"><h3 style="margin-bottom:14px">${id?'Edit':'Add'} product</h3><label>Name<input id="f_n" value="${esc(p.name)}"></label><div class="f2"><label>Price (₹)<input id="f_p" type="number" min="0" value="${p.price??''}"></label><label>Stock<input id="f_s" type="number" min="0" value="${p.stock}"></label></div><div class="f2"><label>Category<input id="f_c" value="${esc(p.category)}"></label><label>Colours (hex, comma separated)<input id="f_k" value="${esc((p.colors||[]).join(','))}"></label></div><label>Product picture<input id="f_f" type="file" accept="image/*"></label><input id="f_i" type="hidden" value="${esc(p.image_url)}">${p.image_url?`<div style="margin:-4px 0 12px"><img src="${esc(p.image_url)}" alt="" style="height:80px;border-radius:10px;vertical-align:middle"> <small style="color:var(--mute)">Choose a new file to replace it</small></div>`:''}<label>Description<textarea id="f_d" rows="3">${esc(p.description)}</textarea></label><label><input id="f_a" type="checkbox" ${p.active?'checked':''}>Show on store</label><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn g" onclick="$('#md').remove()">Cancel</button><button class="btn" onclick="psave(${id||0})">Save</button></div></div>`;document.body.appendChild(m)}
async function shrink(f){if(!/^image\/(jpe?g|png|webp)$/.test(f.type))return f;const b=await createImageBitmap(f),k=Math.min(1,1200/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(x=>r(x||f),f.type=='image/png'?'image/png':'image/jpeg',.85))}
async function psave(id){
 let img=$('#f_i').value.trim()||null;const file=$('#f_f').files[0];
 if(file){toast('Uploading picture...');const blob=await shrink(file),path='products/'+Date.now()+(blob.type=='image/png'?'.png':'.jpg');const u=await sb.storage.from('site').upload(path,blob,{contentType:blob.type});if(u.error)return toast(u.error.message);img=sb.storage.from('site').getPublicUrl(path).data.publicUrl}
 const row={name:$('#f_n').value.trim(),price:+$('#f_p').value,stock:+$('#f_s').value,category:$('#f_c').value.trim(),colors:$('#f_k').value.split(',').map(s=>s.trim()).filter(Boolean),image_url:img,description:$('#f_d').value,active:$('#f_a').checked};
 if(!row.name)return toast('Name required');
 const {error}=id?await sb.from('products').update(row).eq('id',id):await sb.from('products').insert(row);
 if(error)return toast(error.message);$('#md').remove();toast('Saved');start()}
async function tog(id){const p=S.p.find(x=>x.id==id);const {error}=await sb.from('products').update({active:!p.active}).eq('id',id);error?toast(error.message):start()}
async function del(id){if(!confirm('Delete this product permanently?'))return;const {error}=await sb.from('products').delete().eq('id',id);error?toast(error.message):(toast('Deleted'),start())}

function ord(){return `<div class="top"><h1>Orders (${S.o.length})</h1></div>${S.o.map(o=>`<div class="box"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b>${esc(o.id)}</b> <span class="pill ${o.status=='Delivered'?'ok':o.status=='Cancelled'?'off':''}">${esc(o.status)}</span><br><small style="color:var(--mute)">${new Date(o.created_at).toLocaleString('en-IN')} · ${esc(o.payment)}</small></div><div style="text-align:right"><b>${inr(o.total)}</b><br><select style="width:auto" onchange="ost('${esc(o.id)}',this.value)">${STAT.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select></div></div><p style="margin:10px 0 4px">${esc(o.customer_name)} · ${esc(o.phone)}<br><small style="color:var(--mute)">${esc(o.address)}, ${esc(o.city)} ${esc(o.pin)}</small></p>${(o.items||[]).map(i=>`<div style="font-size:14px;color:var(--mute)">${i.q||1} × ${esc(i.name||'Product #'+i.id)}${i.s?' ('+esc(i.s)+')':''}</div>`).join('')}</div>`).join('')||'<div class="box" style="color:var(--mute)">No orders yet.</div>'}`}
async function ost(id,status){const {error}=await sb.from('orders').update({status}).eq('id',id);error?toast(error.message):(toast('Status updated'),start())}

function look(){const s=S.s,v=(k,d)=>esc(s[k]??d);
 return `<div class="top"><h1>Appearance</h1><button class="btn" onclick="lsave()">Save changes</button></div><div class="box"><h3 style="margin-bottom:6px">Logo</h3><p style="color:var(--mute);margin:0 0 12px">Header mein "Trandixo" naam ke bagal mein dikhega. PNG, JPG, WebP ya SVG (transparent PNG best hai). It saves as soon as you upload.</p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:140px;height:90px;border-radius:16px;background:var(--sky);display:grid;place-items:center;overflow:hidden;padding:8px">${s.logo_image?`<img src="${esc(s.logo_image)}" alt="" style="max-width:100%;max-height:100%;object-fit:contain">`:'<small style="color:var(--mute)">No logo</small>'}</div><div><input id="li" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div style="margin-top:10px;display:flex;gap:8px"><button class="btn s" onclick="lup()">Upload logo</button>${s.logo_image?'<button class="btn d s" onclick="lrm()">Remove logo</button>':''}</div></div></div></div><div class="box"><h3 style="margin-bottom:6px">Hero image</h3><p style="color:var(--mute);margin:0 0 12px">Transparent-background PNG. It replaces the bag icon on the home page and saves as soon as you upload.</p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:140px;height:140px;border-radius:16px;background:var(--blue);display:grid;place-items:center;overflow:hidden">${s.hero_image?`<img src="${esc(s.hero_image)}" alt="" style="max-width:100%;max-height:100%">`:'<small style="color:#fff">Default icon</small>'}</div><div><input id="hi" type="file" accept="image/png,image/webp"><div style="margin-top:10px;display:flex;gap:8px"><button class="btn s" onclick="hup()">Upload</button>${s.hero_image?'<button class="btn d s" onclick="hrm()">Use default icon</button>':''}</div></div></div></div><div class="box"><h3 style="margin-bottom:12px">Store text</h3><label>Store name<input id="s_name" value="${v('store_name','TRANDIXO')}"></label><label>Announcement bar (optional)<input id="s_ann" value="${v('announcement','')}"></label><label>Hero headline<input id="s_ht" value="${v('hero_title','Handmade totes, made to be carried.')}"></label><label>Hero text<textarea id="s_hx" rows="2">${v('hero_text','Every TRANDIXO bag is cut, stitched and finished by hand in small batches.')}</textarea></label></div><div class="box"><h3 style="margin-bottom:12px">Look and delivery</h3><div class="f2"><label>Brand colour<input id="s_col" type="color" value="${v('primary','#2f78a8')}"></label><label>Free delivery above (₹)<input id="s_fd" type="number" value="${v('free_delivery',999)}"></label></div><label style="max-width:240px">Delivery fee (₹)<input id="s_df" type="number" value="${v('delivery_fee',60)}"></label></div>`}
async function lsave(){
 const m={store_name:$('#s_name').value,announcement:$('#s_ann').value,hero_title:$('#s_ht').value,hero_text:$('#s_hx').value,primary:$('#s_col').value,free_delivery:+$('#s_fd').value,delivery_fee:+$('#s_df').value};
 const {error}=await sb.from('settings').upsert(Object.entries(m).map(([key,value])=>({key,value})));
 error?toast(error.message):(toast('Appearance saved'),start())}
function rev(){return `<div class="top"><h1>Reviews (${S.r.length})</h1></div>${S.r.map(x=>{const p=S.p.find(y=>y.id==x.product_id);return `<div class="box" style="display:flex;justify-content:space-between;gap:12px"><div><b>${esc(x.name)}</b> <span style="color:#f5a623">${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</span><br><small style="color:var(--mute)">${esc(p?p.name:'Deleted product')} · ${new Date(x.created_at).toLocaleDateString('en-IN')}</small><div>${esc(x.comment)}</div></div><button class="btn d s" onclick="rdel(${x.id})">Delete</button></div>`}).join('')||'<div class="box" style="color:var(--mute)">No reviews yet.</div>'}`}
async function rdel(id){if(!confirm('Delete this review?'))return;const {error}=await sb.from('reviews').delete().eq('id',id);error?toast(error.message):(toast('Deleted'),start())}
async function hup(){const f=$('#hi').files[0];if(!f)return toast('Choose a PNG first');if(f.size>3e6)return toast('Keep it under 3 MB');
 const path='hero-'+Date.now()+'.png',{error}=await sb.storage.from('site').upload(path,f,{contentType:f.type});if(error)return toast(error.message);
 await setHero(sb.storage.from('site').getPublicUrl(path).data.publicUrl)}
async function hrm(){await setHero('')}
async function setHero(v){const {error}=await sb.from('settings').upsert({key:'hero_image',value:v});error?toast(error.message):(toast('Hero image updated'),start())}
async function lup(){const f=$('#li').files[0];if(!f)return toast('Choose a logo file first');if(f.size>2e6)return toast('Keep it under 2 MB');
 const ext=f.type=='image/svg+xml'?'svg':f.type=='image/jpeg'?'jpg':f.type=='image/webp'?'webp':'png';
 toast('Uploading logo...');
 const path='logo-'+Date.now()+'.'+ext,{error}=await sb.storage.from('site').upload(path,f,{contentType:f.type});if(error)return toast(error.message);
 await setLogo(sb.storage.from('site').getPublicUrl(path).data.publicUrl)}
async function lrm(){await setLogo('')}
async function setLogo(v){const {error}=await sb.from('settings').upsert({key:'logo_image',value:v});error?toast(error.message):(toast('Logo updated'),start())}
init();
</script>
</body>
</html>
