<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TRANDIXO Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--blue:#2f78a8;--navy:#123b57;--sky:#e6f1f8;--bg:#f4f8fb;--card:#fff;--ink:#16293a;--mute:#6b7f8f;--line:#dbe6ee;--coral:#f0566a;--ok:#2e9d6b;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Sora',system-ui,sans-serif;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.side{position:fixed;inset:0 auto 0 0;width:220px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{color:var(--blue);font-size:20px;font-weight:700;letter-spacing:.04em;padding:0 10px 18px}
.side button{background:none;text-align:left;padding:11px 14px;border-radius:12px;color:var(--mute);font-weight:500}
.side button.on,.side button:hover{background:var(--sky);color:var(--blue)}
.side .out{margin-top:auto}
main{margin-left:220px;padding:28px;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}
.btn:hover{background:var(--navy)}
.btn.g{background:var(--sky);color:var(--blue)}
.btn.d{background:#fde8eb;color:var(--coral)}
.btn.s{padding:6px 12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
.kpi small{color:var(--mute)}.kpi b{display:block;font-family:'Sora';font-size:24px;margin-top:2px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
.chart i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;padding:8px}
td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.th{width:44px;height:44px;border-radius:10px;background:var(--sky);object-fit:cover;display:block}
.pill{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--sky);color:var(--blue)}
.pill.off{background:#eee;color:#888}.pill.ok{background:#dff3ea;color:var(--ok)}
label{display:block;font-weight:500;font-size:13px;margin-bottom:12px}
input,select,textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}input[type=color]{padding:2px;height:40px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal{position:fixed;inset:0;background:rgba(18,59,87,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{width:100%;max-width:520px;max-height:92vh;overflow:auto;margin:0}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .box{width:100%;max-width:380px}
.err{color:var(--coral);font-size:13px;min-height:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:90}
.bar{display:none}
@media (max-width:860px){
 .side{display:none}main{margin:0;padding:16px 14px 90px}
 .cards{grid-template-columns:1fr 1fr}.two,.f2{grid-template-columns:1fr}
 .bar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
 .bar button{flex:1;background:none;font-size:12px;color:var(--mute);padding:8px 0;font-weight:500}.bar button.on{color:var(--blue);font-weight:700}
}

.tps{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin:12px 0 16px}
.tp{display:flex;flex-direction:column;gap:7px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px;font-weight:500;text-align:left}
.tp .c{display:flex;height:20px;width:100%;border-radius:6px;overflow:hidden}.tp .c i{flex:1}
.tp.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.role{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.role small{display:block;color:var(--mute);font-size:12px}.role b{display:block;font-size:15px;margin-top:2px}
.role.on{border-color:var(--blue);background:var(--sky);box-shadow:0 0 0 2px var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chp{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--mute)}
.chp.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;max-height:420px;overflow:auto;padding:2px}
.ft{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;min-height:92px}
.ft small{color:var(--mute);font-size:11px}.ft>span{line-height:1.25;color:var(--ink)}
.ft:hover{border-color:var(--blue)}.ft.on{border-color:var(--blue);background:var(--sky);box-shadow:0 0 0 2px var(--blue)}
.tg{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;font-size:10px;padding:1px 7px;margin-right:4px}
.warn{color:var(--coral);font-size:13px;min-height:4px;margin:-4px 0 8px}
.pvw{margin-bottom:16px}
@media (min-width:861px){.pvw{position:sticky;top:8px;z-index:6;box-shadow:0 10px 28px rgba(18,59,87,.14)}}
.pv{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;font-family:var(--fb),system-ui,sans-serif;color:#1d2b24;font-size:14px}
.pv-top{background:var(--navy);color:#fff;font-size:11px;padding:6px 14px}
.pv-nav{display:flex;gap:16px;align-items:center;padding:10px 14px;border-bottom:1px solid #e7e1d3;font-size:13px}
.pv-logo{font-family:var(--fh),Georgia,serif;font-size:21px;color:var(--navy);margin-right:auto;font-weight:600}
.pv-nav span.on{color:var(--navy);border-bottom:2px solid var(--navy)}
.pv-hero{padding:16px 14px;background:linear-gradient(100deg,#efe4d0,#e9d9bd)}
.pv-sc{font-family:var(--fa),cursive;font-size:21px;color:#3b3a33}
.pv h2{font-family:var(--fh),Georgia,serif;font-size:26px;line-height:1.15;margin:2px 0 6px;color:#1d2b24}
.pv p{margin:0 0 10px;font-size:13px;color:#4b5b52}
.pv-b{display:inline-block;background:var(--blue);color:#fff;border-radius:99px;padding:8px 18px;font-weight:700;font-size:13px;margin-right:8px}
.pv-b2{display:inline-block;border:1px solid var(--navy);color:var(--navy);border-radius:3px;padding:7px 16px;font-size:13px}
.pv-row{display:flex;gap:8px;padding:12px 14px 4px;flex-wrap:wrap}
.pv-chip{border:1px solid #e7e1d3;border-radius:99px;padding:5px 14px;font-size:12px}
.pv-chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pv-card{display:flex;gap:12px;align-items:center;margin:10px 14px 12px;padding:10px;border:1px solid #e7e1d3;border-radius:14px}
.pv-img{width:60px;height:60px;border-radius:12px;background:var(--sky);flex:none}
.pv-nm{font-family:var(--fh),Georgia,serif;font-weight:600;font-size:16px}
.pv-pr{font-weight:700;color:var(--blue);margin:2px 0 6px}
.pv-pr s{color:#6f7a72;font-weight:400;font-size:12px}.pv-pr em{font-style:normal;color:var(--coral);font-size:12px;margin-left:4px}
.pv-ft{background:var(--navy);color:#dfe8e1;font-size:11px;padding:8px 14px}
@media (max-width:860px){.roles{grid-template-columns:1fr}.fg{max-height:340px}}
.bub{max-width:86%;padding:9px 13px;border-radius:14px;margin:8px 0;background:var(--sky);white-space:pre-wrap;word-break:break-word}
.bub.me{margin-left:auto;background:var(--blue);color:#fff}.bub small{display:block;opacity:.75;font-size:11px;margin-top:3px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s),R=$('#root');
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STAT=['Placed','Packed','Shipped','Delivered','Cancelled'];
let sb,S={pv:{},tk:[],tf:'Open',p:[],o:[],s:{},r:[],c:[],t:[],b:[],pi:{},of:{},pd:{},v:'dash'};
const jo=v=>{try{const x=typeof v=='string'?JSON.parse(v):v;return x&&typeof x=='object'&&!Array.isArray(x)?x:{}}catch(e){return{}}};
let PIMG=[];
const jl=v=>{try{const x=typeof v=='string'?JSON.parse(v):v;return Array.isArray(x)?x:[]}catch(e){return[]}};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
const DEF={u:'https://ukwhqktdelanuqlbfckg.supabase.co',k:'sb_publishable_qTce_OToCZfoors1p1-xzA_4siEte5W'};
function cfg(){try{return JSON.parse(localStorage.getItem('tx_sb'))||DEF}catch(e){return DEF}}

function cfgScreen(){R.innerHTML=`<div class="auth"><div class="box"><h2 style="margin-bottom:6px">Connect Supabase</h2><p style="color:var(--mute);margin:0 0 14px">Supabase > Project Settings > API se Project URL aur anon public key copy karein.</p><label>Project URL<input id="u" placeholder="https://xxxx.supabase.co"></label><label>Anon public key<input id="k"></label><button class="btn" style="width:100%" onclick="saveCfg()">Save and continue</button></div></div>`}
function saveCfg(){const u=$('#u').value.trim(),k=$('#k').value.trim();if(!u||!k)return;localStorage.setItem('tx_sb',JSON.stringify({u,k}));init()}
function loginScreen(e){R.innerHTML=`<div class="auth"><div class="box"><div class="logo" style="padding:0 0 12px">TRANDIXO Admin</div><label>Email<input id="em" type="email" autocomplete="username"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label><div class="err">${esc(e||'')}</div><button class="btn" style="width:100%" onclick="login()">Log in</button></div></div>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?loginScreen(error.message):start()}
async function logout(){await sb.auth.signOut();loginScreen()}

async function init(){const c=cfg();if(!c)return cfgScreen();sb=supabase.createClient(c.u,c.k);const {data}=await sb.auth.getSession();data.session?start():loginScreen()}
async function load(){
 const [p,o,s,rv,tk]=await Promise.all([sb.from('products').select('*').order('id'),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('settings').select('*'),sb.from('reviews').select('*').order('created_at',{ascending:false}),sb.from('support_tickets').select('*').order('updated_at',{ascending:false})]);
 const er=p.error||o.error||s.error;if(er)toast(er.message);
 S.r=rv.data||[];S.tk=tk.data||[];S.tkErr=!!tk.error;S.p=p.data||[];S.o=o.data||[];S.s=Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
 S.c=jl(S.s.categories).filter(c=>c&&c.name);S.t=jl(S.s.trending);S.b=jl(S.s.banners).filter(b=>b&&b.title);S.pi=jo(S.s.product_images);S.of=jo(S.s.offers);S.pd=jo(S.s.product_details);S.dd=jo(S.s.delivery_days);S.pv=normPV(jo(S.s.product_variants));
}
async function start(){await load();draw()}
const TABS=[['dash','Dashboard'],['ord','Orders'],['prod','Products'],['cats','Categories'],['rev','Reviews'],['sup','Support'],['look','Appearance'],['pwd','Password']];
function draw(){
 const nav=TABS.map(([k,l])=>`<button class="${S.v==k?'on':''}" onclick="S.v='${k}';draw()">${k=='sup'&&S.tk.filter(t=>t.status=='Open').length?l+' ('+S.tk.filter(t=>t.status=='Open').length+')':l}</button>`).join('');
 const v={dash,prod,cats,ord,rev,sup,look,pwd}[S.v]();
 R.innerHTML=`<div class="side"><div class="logo">TRANDIXO</div>${nav}<button class="out" onclick="logout()">Log out</button></div><main>${v}</main><div class="bar">${nav}</div>`}

function pwd(){return `<div class="top"><h1>Change password</h1></div><div class="box" style="max-width:460px"><p style="color:var(--mute);margin:0 0 14px">Aapka login email wahi rahega, sirf password badlega. Naya password kam se kam 8 characters ka rakhein.</p><label>Current password<input id="pw_o" type="password" autocomplete="current-password"></label><label>New password<input id="pw_n" type="password" autocomplete="new-password" minlength="8"></label><label>Confirm new password<input id="pw_c" type="password" autocomplete="new-password"></label><div class="err" id="pw_e" style="min-height:20px"></div><button class="btn" id="pw_b" onclick="pwSave()">Update password</button></div>`}
async function pwSave(){
 const e=m=>{$('#pw_e').textContent=m||''},o=$('#pw_o').value,n=$('#pw_n').value,c=$('#pw_c').value;e('');
 if(!o||!n||!c)return e('Teeno fields bharein.');
 if(n.length<8)return e('Naya password kam se kam 8 characters ka hona chahiye.');
 if(n!==c)return e('Naya password aur confirm password match nahi kar rahe.');
 if(n===o)return e('Naya password purane se alag rakhein.');
 const b=$('#pw_b');b.disabled=true;b.textContent='Updating...';
 try{
  const {data:u,error:ue}=await sb.auth.getUser();
  if(ue||!u||!u.user||!u.user.email)throw new Error('Session expire ho gaya. Dobara login karein.');
  const v=await sb.auth.signInWithPassword({email:u.user.email,password:o});
  if(v.error)throw new Error('Current password galat hai.');
  const r=await sb.auth.updateUser({password:n});
  if(r.error)throw new Error(r.error.message);
  ['#pw_o','#pw_n','#pw_c'].forEach(i=>$(i).value='');
  toast('Password updated');
 }catch(x){e(x.message)}
 b.disabled=false;b.textContent='Update password'}
function dash(){
 const ok=S.o.filter(o=>o.status!='Cancelled'),rev=ok.reduce((a,o)=>a+Number(o.total),0),aov=ok.length?rev/ok.length:0;
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return d.toDateString()});
 const byDay=days.map(d=>ok.filter(o=>new Date(o.created_at).toDateString()==d).reduce((a,o)=>a+Number(o.total),0)),mx=Math.max(...byDay,1);
 const tp={};ok.forEach(o=>(o.items||[]).forEach(i=>{const n=i.name||('Product #'+i.id);tp[n]=(tp[n]||0)+(i.q||1)}));
 const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const cnt=s=>S.o.filter(o=>o.status==s).length;
 return `<div class="top"><h1>Dashboard</h1><button class="btn g" onclick="start()">Refresh</button></div>
 <div class="cards"><div class="box kpi"><small>Revenue</small><b>${inr(rev)}</b></div><div class="box kpi"><small>Orders</small><b>${S.o.length}</b></div><div class="box kpi"><small>Avg order value</small><b>${inr(aov)}</b></div><div class="box kpi"><small>Pending (Placed)</small><b>${cnt('Placed')}</b></div></div>
 <div class="two"><div class="box"><h3>Revenue, last 14 days</h3><div class="chart">${byDay.map((v,i)=>`<div title="${inr(v)}"><i style="height:${v/mx*100}%"></i>${new Date(days[i]).getDate()}</div>`).join('')}</div></div>
 <div class="box"><h3 style="margin-bottom:8px">Top products</h3>${top.length?top.map(([n,q])=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)"><span>${esc(n)}</span><b>${q} sold</b></div>`).join(''):'<p style="color:var(--mute)">No sales yet.</p>'}
 <h3 style="margin:16px 0 8px">Order status</h3>${STAT.map(s=>`<div style="display:flex;justify-content:space-between"><span>${s}</span><b>${cnt(s)}</b></div>`).join('')}</div></div>`}

function prod(){return `<div class="top"><h1>Products (${S.p.length})</h1><button class="btn" onclick="pform()">Add product</button></div><div class="box tw"><table><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>${S.p.map(p=>`<tr><td>${p.image_url?`<img class="th" src="${esc(p.image_url)}" alt="">`:`<div class="th" style="background:${esc((p.colors||[])[0]||'#2f78a8')}"></div>`}</td><td><b>${esc(p.name)}</b><br><small style="color:var(--mute)">${esc(p.category)}</small></td><td>${inr(p.price)}${S.of[p.id]?` <span class="pill">${S.of[p.id]}% off</span>`:''}</td><td>${aOut(p)?'<span class="pill off">Out of stock</span>':p.stock}</td><td><span class="pill ${p.active?'ok':'off'}">${p.active?'Live':'Hidden'}</span>${S.t.includes(p.id)?' <span class="pill">Trending</span>':''}</td><td style="white-space:nowrap"><button class="btn g s" onclick="pform(${p.id})">Edit</button> <button class="btn g s" onclick="rlink(${p.id})">Review link</button> <button class="btn g s" onclick="ostk(${p.id})">${aOut(p)?'Mark in stock':'Mark out of stock'}</button> <button class="btn g s" onclick="tog(${p.id})">${p.active?'Hide':'Show'}</button> <button class="btn d s" onclick="del(${p.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mute)">No products yet. Add your first tote.</td></tr>'}</table></div>`}
function pform(id){const p=S.p.find(x=>x.id==id)||{active:true,colors:['#2f78a8'],category:'Canvas',stock:10};
 const m=document.createElement('div');m.className='modal';m.id='md';
 m.innerHTML=`<div class="box"><h3 style="margin-bottom:14px">${id?'Edit':'Add'} product</h3><label>Name<input id="f_n" value="${esc(p.name)}"></label><div class="f2"><label>Price (₹)<input id="f_p" type="number" min="0" value="${p.price??''}"></label><label>Stock (0 = out of stock)<input id="f_s" type="number" min="0" value="${p.stock}"></label></div><label>Category${S.c.length?`<select id="f_c">${(S.c.some(c=>c.name==p.category)||!p.category||!id?S.c:[...S.c,{name:p.category}]).map(c=>`<option ${c.name==p.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:`<input id="f_c" value="${esc(p.category)}">`}</label>
 <label><input id="f_x" type="checkbox" ${(S.pv[p.id]||{}).out?'checked':''}><b>Poora product Out of stock</b> (store par "Out of stock" dikhega, order nahi ho payega)</label>
 <label>Swatch colours (hex, comma separated, sirf jab variants na hon)<input id="f_k" value="${esc((p.colors||[]).join(','))}"></label>
 <div style="margin:14px 0 4px"><b>Variants</b><div style="color:var(--mute);font-size:13px;margin:2px 0 10px">Har variant ka apna naam (jaise Red — Medium), image, price, MRP aur stock. Koi variant na jodo to store par default Small / Medium / Large dikhega.</div><div id="vs_l"></div><button type="button" class="btn g s" onclick="vadd()">+ Add variant</button></div>
 
 <label>Product pictures (up to 4)<input id="f_f" type="file" accept="image/*" multiple></label><div id="f_g" style="display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 12px"></div><label>Estimated delivery (days) <small style="color:var(--mute);font-weight:400">— product page par dikhega. Likhein: 5 ya 3-5. Khali = store ka default</small><input id="f_dd" value="${esc(S.dd[p.id]||'')}" placeholder="e.g. 3-5"></label><label>Short description (shown under price)<textarea id="f_d" rows="2">${esc(p.description)}</textarea></label><label>Product details (shown below the product)<textarea id="f_pd" rows="7" placeholder="Write about the product.

Use a new line starting with - for points:
- Material: cotton canvas
- Size: 38 x 40 cm

Start a line with # for a heading.">${esc(S.pd[p.id]||'')}</textarea></label><label><input id="f_a" type="checkbox" ${p.active?'checked':''}>Show on store</label><label><input id="f_t" type="checkbox" ${S.t.includes(p.id)?'checked':''}>Show in "Trending Now" on home page</label><div class="f2"><label><input id="f_o" type="checkbox" ${S.of[p.id]?'checked':''}>Put this product on Offer</label><label>Discount %<input id="f_op" type="number" min="1" max="90" value="${S.of[p.id]||''}" placeholder="e.g. 20"></label></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn g" onclick="$('#md').remove()">Cancel</button><button class="btn" onclick="psave(${id||0})">Save</button></div></div>`;document.body.appendChild(m);PIMG=[p.image_url,...(S.pi[p.id]||[])].filter(Boolean);pgal();

 const cf=S.pv[p.id]||{};

async function shrink(f,kb=49,mx=1200,force=0){
 if(!/^image\//.test(f.type)||(!force&&/svg|gif/.test(f.type)))return f;
 const LIM=kb*1024,bmp=await createImageBitmap(f);let max=mx,q=.85,best=null;
 const enc=(w,h,t,qq,fill)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(fill){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(bmp,0,0,w,h);return new Promise(r=>c.toBlob(r,t,qq))};
 for(let i=0;i<24;i++){
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k));
  let b=await enc(w,h,'image/webp',q);
  if(!b||b.type!='image/webp')b=await enc(w,h,'image/jpeg',q,true);
  if(!best||b.size<best.size)best=b;
  if(b.size<=LIM)return b;
  if(q>.5)q-=.1;else{max*=.8;q=.7}
 }
 return best||f}

function fgHTML(){const q=TH.q.trim().toLowerCase(),r=TH.role,cur=TH['f'+r],hi=TH.cat=='hi';
 const samp={h:'Handmade Bags',b:'Carry art, not just an accessory.',a:'Unique • Handcrafted'}[r]+(hi?' · हस्तनिर्मित':''),sz={h:21,b:14,a:22}[r];
 const L=FONTS.map((f,i)=>[f,i]).filter(([f])=>(!q||f[0].toLowerCase().includes(q))&&(TH.cat=='all'||(hi?f[3]:f[2]==TH.cat)));
 return L.map(([f,i])=>{const fb=f[2]=='serif'?'serif':f[2]=='script'?'cursive':'sans-serif',tg=ROLES.filter(([k])=>TH['f'+k]==f[0]).map(([k,l])=>`<span class="tg">${l.split(' ')[0]}</span>`).join('');
  return `<button class="ft ${f[0]==cur?'on':''}" onclick="pickFont(${i})"><small>${f[0]}${f[3]?' · हिन्दी':''}</small><span style="font-family:'${f[0]}',${fb};font-size:${sz}px">${samp}</span><span>${tg}</span></button>`}).join('')||'<p style="color:var(--mute)">Koi font nahi mila.</p>'}
function fgDraw(){$('#fg').innerHTML=fgHTML()}
function thFontSync(){$('#pv').setAttribute('style',pvVars());$('#roles').innerHTML=roleHTML();$('#chips').innerHTML=chipHTML();fgDraw()}
function setRole(r){TH.role=r;TH.cat=r=='a'?'script':'all';thFontSync()}
function pickFont(i){TH['f'+TH.role]=FONTS[i][0];thFontSync()}
function thReset(){Object.assign(TH,TDEF,{q:'',cat:'all'});$('#fq').value='';thColSync();thFontSync()}

/* ===== Support inbox ===== */
const TKS=['Open','In progress','Resolved','Closed'];
function sup(){const f=S.tf||'Open',list=S.tk.filter(t=>f=='All'||t.status==f),cn=x=>S.tk.filter(t=>t.status==x).length;
 return `<div class="top"><h1>Support (${S.tk.length})</h1><div style="display:flex;gap:8px;flex-wrap:wrap">${[...TKS,'All'].map(x=>`<button class="btn s ${f==x?'':'g'}" onclick="S.tf='${x}';draw()">${x}${x!='All'?' ('+cn(x)+')':''}</button>`).join('')}</div></div>${S.tkErr?'<div class="box" style="color:var(--coral)">Support tables not found. Run supabase_setup.sql in Supabase &gt; SQL Editor first.</div>':''}<div class="box tw"><table><tr><th>#</th><th>Customer</th><th>Subject</th><th>Order</th><th>Status</th><th>Updated</th><th></th></tr>${list.map(t=>`<tr><td>${t.id}</td><td>${esc(t.name||'')}<br><small style="color:var(--mute)">${esc(t.email||'')}</small></td><td>${esc(t.subject)}<br><small style="color:var(--mute)">${esc(t.category||'')}</small></td><td>${esc(t.order_id||'—')}</td><td><span class="pill ${t.status=='Resolved'||t.status=='Closed'?'ok':t.status=='Open'?'':'off'}">${esc(t.status)}</span></td><td><small>${new Date(t.updated_at).toLocaleString('en-IN')}</small></td><td><button class="btn s" onclick="tkOpen(${t.id})">Open</button></td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--mute)">No requests here.</td></tr>'}</table></div>`}
async function tkOpen(id){const t=S.tk.find(x=>x.id==id);if(!t)return;
 const q=await sb.from('support_messages').select('*').eq('ticket_id',id).order('created_at');if(q.error)return toast(q.error.message);
 $('#md')&&$('#md').remove();const m=document.createElement('div');m.className='modal';m.id='md';const wa=(t.phone||'').replace(/\D/g,'');
 m.innerHTML=`<div class="box" style="max-width:640px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3>#${t.id} · ${esc(t.subject)}</h3><small style="color:var(--mute)">${esc(t.name||'')} · ${esc(t.email||'')}${t.phone?' · '+esc(t.phone):''}${t.order_id?' · Order '+esc(t.order_id):''}</small></div><select style="width:auto" onchange="tkStatus(${t.id},this.value)">${TKS.map(x=>`<option ${x==t.status?'selected':''}>${x}</option>`).join('')}</select></div><div id="tk_m" style="margin:14px 0;max-height:46vh;overflow:auto">${q.data.map(x=>`<div class="bub ${x.sender=='admin'?'me':''}">${esc(x.body)}<small>${x.sender=='admin'?'You':'Customer'} · ${new Date(x.created_at).toLocaleString('en-IN')}</small></div>`).join('')}</div><label>Reply<textarea id="tk_r" rows="3" maxlength="2000"></textarea></label><div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn g" onclick="$('#md').remove()">Close</button>${wa.length>=10?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${wa.length==10?'91'+wa:wa}">WhatsApp</a>`:''}<button class="btn" onclick="tkSend(${t.id})">Send reply</button></div></div>`;
 document.body.appendChild(m);$('#tk_m').scrollTop=1e9}
async function tkSend(id){const b=$('#tk_r').value.trim();if(!b)return toast('Write a reply first');
 const r=await sb.from('support_messages').insert({ticket_id:id,sender:'admin',body:b});if(r.error)return toast(r.error.message);
 toast('Reply sent');await load();draw();tkOpen(id)}
async function tkStatus(id,v){const r=await sb.from('support_tickets').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);
 if(r.error)return toast(r.error.message);toast('Status: '+v);await load();draw()}

init();
</script>
