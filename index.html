<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trandixo – Handmade Bags, Clothing &amp; Accessories</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Dancing+Script:wght@500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f4a38;--navy:#183a2b;--sky:#eef1e6;--bg:#faf8f3;--card:#fff;--ink:#1d2b24;--mute:#6f7a72;--line:#e7e1d3;--gold:#f2c14e;--coral:#c8553d;--ok:#2e9d6b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Playfair Display',system-ui,sans-serif;margin:0;line-height:1.2}
button{font:inherit;cursor:pointer;border:0;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-size:22px;font-weight:700;color:var(--blue);letter-spacing:.04em}
nav{display:flex;gap:6px;margin-left:8px;flex:none}
nav a{padding:8px 14px;border-radius:99px;color:var(--mute);font-weight:500}
nav a.on,nav a:hover{background:var(--sky);color:var(--blue)}
.icons{display:flex;gap:10px;margin-left:auto}
.ib{position:relative;background:var(--sky);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--blue);transition:background .15s}
.ib:hover,.ib.on{background:var(--blue);color:#fff}
.ib b{position:absolute;top:-2px;right:-2px;background:var(--coral);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.search{position:relative;flex:1;max-width:440px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search input{margin:0;padding:11px 14px 11px 42px;border-radius:99px;background:var(--bg);-webkit-appearance:none;appearance:none}
.tabs{display:none}
.btn{background:var(--blue);color:#fff;border-radius:14px;padding:14px 24px;font-weight:700;display:inline-block;text-align:center;transition:background .15s}
.btn:hover{background:var(--navy);color:#fff}
.btn.ghost{background:var(--sky);color:var(--blue)}
.btn.block{display:block;width:100%}
.hero{background:var(--blue);color:#fff;border-radius:0 0 36px 36px}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding-top:48px;padding-bottom:0}
.hero h1{font-size:clamp(34px,5vw,56px);margin-bottom:14px}
.hero p{font-size:18px;opacity:.9;max-width:440px;margin:0 0 26px}
.hero .btn{background:#fff;color:var(--blue)}
.hero .art{display:flex;justify-content:center;align-items:flex-end;position:relative;padding-top:20px}
.hero .art svg{width:min(380px,90%);height:auto;margin-bottom:-24px;filter:drop-shadow(0 24px 24px rgba(0,0,0,.25))}
.hero .art img{width:min(400px,90%);max-height:440px;object-fit:contain;margin-bottom:-24px;filter:drop-shadow(0 24px 24px rgba(0,0,0,.25))}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:56px 0 8px}
.perk{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line)}
.perk b{display:block;font-family:'Playfair Display';margin-bottom:2px}
.perk span{color:var(--mute);font-size:14px}
section.s{padding:28px 0}
.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.sh h2{font-size:26px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pc{display:block;position:relative}.pc>a{display:block}
.pc .im{border-radius:20px;aspect-ratio:1/1.05;display:grid;place-items:center;transition:transform .2s}
.pc:hover .im{transform:translateY(-4px)}
.pc .im svg{width:78%;height:auto}
.pc .n{margin-top:10px;color:var(--mute);font-size:14px}
.pc .p{font-weight:700}
.story{background:var(--sky);border-radius:28px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:24px 0 48px;align-items:center}
.story h2{font-size:28px;margin-bottom:10px}
.story p{color:var(--mute);margin:0}
footer{border-top:1px solid var(--line);background:var(--card);padding:36px 0 40px;color:var(--mute);font-size:15px;text-align:left}
.ft .logo{display:inline-block;margin-bottom:14px}
.ft-i{margin:0 0 20px;line-height:1.8}
.ft-l a{display:block;color:var(--ink);padding:6px 0}
.ft-l a:hover{color:var(--blue)}
.soc{display:flex;gap:14px;margin:22px 0}
.soc a{width:54px;height:54px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;color:var(--mute);background:var(--card)}
.soc a:hover{color:var(--blue);border-color:var(--blue)}
.ft-c{border-top:1px solid var(--line);padding-top:18px;font-size:14px}
.rt{font-size:14px;margin-top:4px}.rt span{color:#f5a623;letter-spacing:1px}.rt small{color:var(--mute)}.rt.big{font-size:16px;margin:8px 0 0}
.share{display:flex;gap:10px;margin-top:18px}.share .btn{flex:1}
.rv{padding:12px 0;border-top:1px solid var(--line)}.rv small{color:var(--mute)}
.pick{display:flex;gap:2px;margin-bottom:10px}.pick button{background:none;font-size:32px;line-height:1;color:var(--line);padding:0 2px}.pick button.on{color:#f5a623}
.pd .stage img{height:auto!important;max-height:560px;object-fit:contain!important}
/* product */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:32px 0 48px}
.pd .stage{border-radius:28px;display:grid;place-items:center;min-height:460px;position:relative}
.pd .stage svg{width:72%;height:auto;filter:drop-shadow(0 20px 18px rgba(0,0,0,.2))}
.back{display:inline-flex;gap:6px;color:var(--mute);margin:20px 0 0;font-weight:500}
.pd h1{font-size:34px;margin:4px 0 6px}
.price{font-family:'Playfair Display';font-size:30px;font-weight:700;color:var(--blue);margin:10px 0}
.opt{margin:22px 0 8px;font-weight:700}
.sw{display:flex;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--blue)}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.sizes button{background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:500}
.sizes button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.qty{display:inline-flex;align-items:center;gap:12px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px}
.buyrow{display:flex;gap:12px;margin-top:28px}
.buyrow .btn{flex:1}
.meta{color:var(--mute);margin:16px 0 0;padding:0;list-style:none;font-size:15px}
.meta li{padding:4px 0}
/* cart / checkout */
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;padding:24px 0 48px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.box h3{margin-bottom:14px;font-size:18px}
.li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .th{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none}
.li .th svg{width:80%}
.li .i{flex:1;min-width:0}
.li .i small{color:var(--mute);display:block}
.rm{background:none;color:var(--coral);font-size:13px;padding:0}
.row{display:flex;justify-content:space-between;padding:6px 0}
.row.t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
label{display:block;font-weight:500;font-size:14px;margin-bottom:12px}
input,textarea{width:100%;margin-top:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pay label{flex:1;min-width:130px;margin:0;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer}
.pay input{width:auto;margin:0}
.empty{text-align:center;padding:64px 20px;color:var(--mute)}
.empty h2{color:var(--ink);margin-bottom:8px}
/* orders */
.ord{margin-bottom:16px}
.oh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.badge{background:var(--sky);color:var(--blue);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.badge.ok{background:#dff3ea;color:var(--ok)}
.trk{display:flex;margin:18px 0 6px}
.trk div{flex:1;text-align:center;font-size:12px;color:var(--mute);position:relative}
.trk div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1}
.trk div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.trk div:first-child:after{display:none}
.trk .d{color:var(--ink)}
.trk .d:before,.trk .d:after{background:var(--blue)}
.ok-ic{width:72px;height:72px;border-radius:50%;background:#dff3ea;color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:34px}
/* profile */
.pf-head{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.av{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 26px 'Playfair Display',sans-serif;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--sky);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font:700 20px 'Playfair Display',sans-serif;color:var(--blue)}
.stat span{font-size:13px;color:var(--mute)}
/* wishlist + pages */
.wbtn{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
[data-wish] svg{fill:none}
[data-wish].on svg{fill:currentColor}
.wbtn.on,.btn.lbl.on{color:var(--coral)}
.lbl svg{vertical-align:-4px;margin-right:6px}
.doc{max-width:760px;margin:28px auto 56px;padding:28px}
.doc h2{font-size:28px;margin-bottom:14px}
.doc h3{font-size:17px;margin:22px 0 6px}
.doc p,.doc li{color:var(--mute);margin:0 0 8px}
.doc ul{padding-left:20px;margin:0}
.doc .row{gap:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:50;font-weight:500}
@media (max-width:860px){
 nav{display:none}.bar{justify-content:space-between}
 .hero .wrap,.pd,.two,.story{grid-template-columns:1fr}
 .hero .wrap{padding-top:32px;text-align:center}.hero p{margin:0 auto 22px}
 .grid{grid-template-columns:repeat(2,1fr);gap:14px}
 .perks{grid-template-columns:1fr}
 .pd{gap:18px;padding-top:12px}.pd .stage{min-height:340px}
 .story{padding:24px}
 body{padding-bottom:76px}
 .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
 .tabs a{flex:1;text-align:center;font-size:12px;color:var(--mute);padding:6px 0;font-weight:500}
 .tabs a.on{color:var(--blue)}.tabs svg{display:block;margin:0 auto 2px}
 .f2{grid-template-columns:1fr}
 .bar{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:10px}
 .search{order:3;flex:1 1 100%;max-width:none}
 .doc{padding:20px;margin-top:18px}
}
select{width:100%;margin-top:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.btn.sm{padding:9px 22px;font-size:14px}
.bd{position:fixed;inset:0;width:100%;background:rgba(0,0,0,.4);z-index:60;border:0;padding:0;border-radius:0}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh b{font-size:18px;letter-spacing:.06em}.dh button{background:none;font-size:28px;line-height:1;padding:2px 8px}
.db{flex:1;overflow:auto;padding:4px 22px}
.dg{padding:18px 0;border-bottom:1px solid var(--line)}.dg:last-child{border:0}
.dg h4{margin:0 0 10px;font:700 12px 'DM Sans',sans-serif;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.ck{display:flex;align-items:center;gap:12px;padding:8px 0;margin:0;font-size:15px;cursor:pointer}
.ck input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--blue);flex:none}
.ck em{margin-left:auto;font-style:normal;color:var(--mute);font-size:13px}
.df{display:flex;gap:12px;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.df .btn{flex:1;padding:13px}
.cts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}.cts::-webkit-scrollbar{display:none}
.ct{flex:0 0 auto;width:96px;text-align:center;padding:6px 4px 0;border-bottom:3px solid transparent;color:var(--ink)}
.ct.on{border-color:var(--blue);color:var(--blue)}
.cti{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 8px;border-radius:50%;overflow:hidden;background:#f1ece0;color:var(--mute)}
.cti img{width:100%;height:100%;object-fit:cover}.cti svg{max-width:68%;max-height:68%;height:auto}
.ctn{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2 theme (matches mockup) ===== */
[hidden]{display:none!important}
body{background:#fff}
h1,h2,h3,.logo{font-family:'Playfair Display',Georgia,serif}
.btn{border-radius:99px}
.btn.line{background:none;border:1px solid var(--navy);color:var(--navy);border-radius:3px;padding:12px 20px;font-weight:500}
.btn.line:hover{background:var(--navy);color:#fff}
.top{background:var(--navy);color:#fff;font-size:12px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
.top .l,.top .r{display:flex;align-items:center;gap:8px}.top .r{gap:22px}
.top a{color:#fff;opacity:.9}.top a:hover{opacity:1}
.bar{height:76px}
.logo{font-size:34px;font-weight:600;color:var(--navy);letter-spacing:0;line-height:1;display:inline-block}
.logo{display:inline-flex;align-items:center;gap:10px}.logo img{height:44px;width:auto;max-width:120px;object-fit:contain;display:block}
.logo small{display:block;font:500 10px 'DM Sans',sans-serif;letter-spacing:.04em;color:var(--mute);margin-top:5px}
nav{flex:1;justify-content:center;gap:28px;margin:0}
nav>a,.dd>a{padding:6px 2px;border-radius:0;font-size:14px;color:var(--ink);font-weight:500;border-bottom:2px solid transparent}
nav a.on,nav a:hover{background:none;color:var(--navy);border-color:var(--navy)}
.dd{position:relative;display:inline-block}
.dm{display:none;position:absolute;top:calc(100% - 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:190px;box-shadow:0 12px 28px rgba(0,0,0,.1);z-index:40}
.dd:hover .dm,.dd:focus-within .dm{display:block}
.dm a{display:block;padding:9px 12px;border-radius:8px;border:0;font-size:14px;color:var(--ink);font-weight:500}
.dm a:hover{background:var(--sky);color:var(--navy)}
.icons{gap:4px}
.ib{background:none;width:40px;height:40px;color:var(--ink);border-radius:50%}
.ib:hover,.ib.on{background:none;color:var(--blue)}
.ib b{background:var(--navy);min-width:16px;height:16px;font-size:10px;top:0;right:0;padding:0 3px}
.srow{background:#fff;border-bottom:1px solid var(--line);padding:12px 0}
.srow .search{max-width:none}
.hx{position:relative;min-height:330px;display:flex;align-items:center;overflow:hidden;background:linear-gradient(100deg,#efe4d0 0%,#e9d9bd 55%,#d9bf98 100%) center/cover}
.hx:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(250,244,232,.92) 0%,rgba(250,244,232,.6) 45%,rgba(250,244,232,0) 75%)}
.hx .wrap{position:relative;width:100%;padding-top:40px;padding-bottom:40px}
.hx .art{position:absolute;right:8%;bottom:-14px;width:min(320px,38%)}
.hx .art svg{width:100%;height:auto;filter:drop-shadow(0 18px 18px rgba(0,0,0,.2))}
.script{font:500 28px 'Dancing Script',cursive;color:#3b3a33;margin-bottom:6px}
.hx h1{font-size:clamp(36px,5vw,54px);font-weight:600;color:var(--ink);line-height:1.08;max-width:520px;margin-bottom:14px}
.hx p{max-width:390px;font-size:17px;color:var(--ink);margin:0 0 22px}
.cs{background:#f7f3ea;padding:26px 0}
.cs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.ci{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 10px;border-left:1px solid var(--line)}
.ci:first-child{border:0}
.cth{width:92px;height:92px;border-radius:50%;overflow:hidden;background:#eadfca;display:grid;place-items:center;margin-bottom:12px;color:var(--navy)}
.cth img{width:100%;height:100%;object-fit:cover}.cth svg{width:70%;height:auto}
.cth.ic{background:#efe9d6}.cth.ic svg{width:42px}
.ci b{font-weight:500;font-size:15px}.ci span{font-size:12px;color:var(--mute)}
.tr{display:grid;grid-template-columns:250px 1fr;gap:28px;padding:44px 0 48px;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-bottom:6px}
.tr h2{font-size:34px;font-weight:600;margin-bottom:10px}
.tr .grid{grid-template-columns:repeat(4,1fr);gap:20px}
.pc .im{aspect-ratio:5/4;border-radius:4px;overflow:hidden}
.pc .n{color:var(--ink);font-weight:500;font-size:14px;margin-top:10px}
.pc .p{font-size:14px;margin-top:2px}
.qa{display:block;width:80%;background:var(--navy);color:#fff;border-radius:3px;padding:9px;font-size:13px;margin-top:10px}
.qa:hover{background:var(--blue)}.qa:disabled{opacity:.5;cursor:default}
.wbtn{width:30px;height:30px;top:8px;right:8px}
.chip{display:inline-block}
.bn{display:grid;grid-template-columns:repeat(var(--n,3),1fr)}
.bi{min-height:220px;padding:34px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;color:#fff;background-size:cover;background-position:center}
.bi h3{font-size:30px;font-weight:500;line-height:1.1;margin-bottom:10px}
.bi p{margin:0 0 16px;font-size:15px;max-width:210px}
.pill{display:inline-block;background:#fff;color:var(--navy);border-radius:99px;padding:9px 18px;font-size:13px;font-weight:500}
.bi.dk{color:var(--ink)}.bi.dk .pill{background:var(--navy);color:#fff}
.why{background:#faf6ec;padding:24px 0}
.why .wrap{display:grid;grid-template-columns:1.3fr repeat(5,1fr);align-items:center}
.why h3{font-size:20px;font-weight:500}.why p{margin:4px 0 0;font-size:12px;color:var(--mute);max-width:210px}
.wi{text-align:center;padding:4px 10px;border-left:1px solid var(--line);font-size:12px}
.wi svg{display:block;margin:0 auto 8px;color:var(--navy)}

 else if(d.wish){const id=+d.wish,i=wish.indexOf(id),on=i<0;on?wish.push(id):wish.splice(i,1);sv('tx_wish',wish);
  document.querySelectorAll('[data-wish="'+id+'"]').forEach(b=>{b.classList.toggle('on',on);const wt=b.querySelector('.wt');if(wt)wt.textContent=on?'Saved':'Save'});
  badge();toast(on?'Added to wishlist':'Removed from wishlist');if(location.hash.indexOf('#/wishlist')==0)route(1)}
 else if(d.fopen){fopen=true;route(1)}
 else if(d.fclose){fopen=false;route(1)}
 else if(d.fapply){fprice=[...document.querySelectorAll('.dr input[name=pr]:checked')].map(x=>+x.value);fsort=(document.querySelector('.dr input[name=so]:checked')||{}).value||'';fstock=!!$('#fst').checked;fopen=false;route(1)}
 else if(d.fclear){fprice=[];fsort='';fstock=false;fopen=false;route(1)}
 else if(d.clr){if(confirm('Clear saved details?')){prof={};sv('tx_profile',prof);toast('Details cleared');route()}}
});
let sb=null;
document.addEventListener('submit',async e=>{
 if(e.target.id!='cf')return;e.preventDefault();const btn=e.target.querySelector('button');btn.disabled=true;
 const f=Object.fromEntries(new FormData(e.target)),s=subtotal(),id='TDX-'+Math.floor(10000+Math.random()*90000);
 const items=cart.map(i=>({...i,name:(PRODUCTS.find(x=>x.id==i.id)||{}).name,price:lineUnit(i)}));
 const o={id,t:Date.now(),items,total:s+ship(s),pay:f.pay,name:f.name,addr:f.addr,city:f.city,pin:f.pin,status:'Placed'};
 if(sb){const {error}=await sb.from('orders').insert({id,customer_name:f.name,phone:f.phone,address:f.addr,city:f.city,pin:f.pin,payment:f.pay,items,total:o.total,status:'Placed'});
  if(error){btn.disabled=false;return toast('Order failed: '+error.message)}}
 if(!prof.name){prof={name:f.name,phone:f.phone,addr:f.addr,city:f.city,pin:f.pin};sv('tx_profile',prof)}
 orders.unshift(o);cart=[];save();location.hash='#/orders/'+id;
});
document.addEventListener('submit',e=>{
 if(e.target.id!='pf')return;e.preventDefault();
 prof=Object.fromEntries(new FormData(e.target));sv('tx_profile',prof);toast('Profile saved');route();
});
document.addEventListener('submit',async e=>{
 if(e.target.id!='rf')return;e.preventDefault();if(!rate)return toast('Tap the stars to rate');
 const f=Object.fromEntries(new FormData(e.target));
 const {data,error}=await sb.from('reviews').insert({product_id:pid(),name:f.name.trim(),rating:rate,comment:f.comment.trim()}).select().single();
 if(error)return toast(error.message);REV.unshift(data);rate=0;toast('Thanks for your review!');route();
});
let sT;
document.addEventListener('input',e=>{
 if(e.target.id!='sq')return;clearTimeout(sT);const v=e.target.value.trim();
 sT=setTimeout(()=>{if(v)location.hash='#/search/'+encodeURIComponent(v);else if(location.hash.indexOf('#/search')==0)location.hash='#/shop'},350)});
document.addEventListener('submit',e=>{
 if(e.target.id!='sf')return;e.preventDefault();clearTimeout(sT);const v=$('#sq').value.trim();
 if(v)location.hash='#/search/'+encodeURIComponent(v);$('#sq').blur()});
document.addEventListener('submit',async e=>{
 if(e.target.id!='tf')return;e.preventDefault();
 const id=String(new FormData(e.target).get('oid')||'').trim().toUpperCase(),out=$('#tres'),lo=orders.find(o=>o.id==id);
 out.innerHTML='<p style="color:var(--mute)">Checking…</p>';
 let status=lo?(lo.status||STEPS[stage(lo)]):null;
 if(sb){try{const q=await sb.rpc('order_status',{ids:[id]});const r=q.data&&q.data[0];if(r)status=r.status}catch(err){}}
 if(!status){out.innerHTML='<div class="box" style="background:var(--bg)"><b>Order not found</b><p style="color:var(--mute);margin:6px 0 0">Please check the order ID and try again.</p></div>';return}
 const s=Math.max(0,STEPS.indexOf(status)),cx=status=='Cancelled';
 out.innerHTML=`<div class="box" style="background:var(--bg)"><div class="oh"><b>${esc(id)}</b><span class="badge ${s==3&&!cx?'ok':''}">${esc(status)}</span></div>${cx?'':`<div class="trk">${STEPS.map((x,k)=>`<div class="${k<=s?'d':''}">${x}</div>`).join('')}</div>`}</div>`;
});
async function boot(){
 if(SB_URL&&SB_KEY){try{
  sb=supabase.createClient(SB_URL,SB_KEY);
  const [p,r]=await Promise.all([sb.from('products').select('*').eq('active',true).order('id'),sb.from('settings').select('*')]);
  if(!p.error&&p.data)PRODUCTS=p.data.map(x=>({id:x.id,name:x.name,cat:x.category||'All',price:+x.price,desc:x.description||'',cols:(x.colors&&x.colors.length)?x.colors:['#2f78a8'],image_url:x.image_url,stock:x.stock,bg:tint((x.colors||[])[0])}));
  Object.assign(ST,Object.fromEntries((r.data||[]).map(x=>[x.key,x.value])));
  CATS=jl(ST.categories).filter(c=>c&&c.name);TREND=jl(ST.trending);BANNERS=jl(ST.banners).filter(b=>b&&b.title);
  ST.free=+(ST.free_delivery??ST.free);
  const rv=await sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(1000);if(rv.data)REV=rv.data;ST.fee=+(ST.delivery_fee??ST.fee);
  const ids=orders.map(o=>o.id);
  if(ids.length){const q=await sb.rpc('order_status',{ids});if(q.data){q.data.forEach(x=>{const o=orders.find(y=>y.id==x.id);if(o)o.status=x.status});save()}}
 }catch(e){}}
  let nm=ST.store_name||'Trandixo';if(nm===nm.toUpperCase())nm=nm.charAt(0)+nm.slice(1).toLowerCase();document.title=nm+' – Handmade Bags, Clothing & Accessories';$('#lg').textContent=nm;{const li=$('#lgi');if(ST.logo_image){li.src=ST.logo_image;li.hidden=false}else li.hidden=true}
 $('#ft').innerHTML=footerHTML(nm);
  cart=cart.filter(i=>PRODUCTS.some(p=>p.id==i.id));wish=wish.filter(id=>PRODUCTS.some(p=>p.id==id));sv('tx_wish',wish);save();route();
}
boot();
</script>
