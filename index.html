<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trandixo – Handmade Bags, Clothing &amp; Accessories</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Dancing+Script:wght@500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--fh:'Playfair Display';--fb:'DM Sans';--fa:'Dancing Script';--blue:#2f78a8;--navy:#123b57;--sky:#e6f1f8;--bg:color-mix(in srgb,var(--sky) 35%,#fff);--card:#fff;--ink:color-mix(in srgb,var(--navy) 80%,#000);--mute:color-mix(in srgb,var(--navy) 70%,#fff);--line:color-mix(in srgb,var(--blue) 20%,#fff);--gold:#f2c14e;--coral:#c8553d;--ok:#2e9d6b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb),system-ui,sans-serif}
h1,h2,h3,.logo{font-family:var(--fh),system-ui,sans-serif;margin:0;line-height:1.2}
button{font:inherit;cursor:pointer;border:0;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-size:22px;font-weight:700;color:var(--blue);letter-spacing:.04em}
nav{display:flex;gap:6px;margin-left:8px;flex:none}
nav a{padding:8px 14px;border-radius:99px;color:var(--mute);font-weight:500}
nav a.on,nav a:hover{background:var(--sky);color:var(--blue)}
.icons{display:flex;gap:10px;margin-left:auto}
.ib{position:relative;background:var(--sky);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--blue);transition:background .15s}
.ib:hover,.ib.on{background:var(--blue);color:#fff}
.ib b{position:absolute;top:-2px;right:-2px;background:var(--coral);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.search{position:relative;flex:1;max-width:440px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search input{margin:0;padding:11px 14px 11px 42px;border-radius:99px;background:var(--bg);-webkit-appearance:none;appearance:none}
.tabs{display:none}
.btn{background:var(--blue);color:#fff;border-radius:14px;padding:14px 24px;font-weight:700;display:inline-block;text-align:center;transition:background .15s}
.btn:hover{background:var(--navy);color:#fff}
.btn.ghost{background:var(--sky);color:var(--blue)}
.btn.block{display:block;width:100%}
.hero{background:var(--blue);color:#fff;border-radius:0 0 36px 36px}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding-top:48px;padding-bottom:0}
.hero h1{font-size:clamp(34px,5vw,56px);margin-bottom:14px}
.hero p{font-size:18px;opacity:.9;max-width:440px;margin:0 0 26px}
.hero .btn{background:#fff;color:var(--blue)}
.hero .art{display:flex;justify-content:center;align-items:flex-end;position:relative;padding-top:20px}
.hero .art svg{width:min(380px,90%);height:auto;margin-bottom:-24px;filter:drop-shadow(0 24px 24px rgba(0,0,0,.25))}
.hero .art img{width:min(400px,90%);max-height:440px;object-fit:contain;margin-bottom:-24px;filter:drop-shadow(0 24px 24px rgba(0,0,0,.25))}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:56px 0 8px}
.perk{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line)}
.perk b{display:block;font-family:var(--fh);margin-bottom:2px}
.perk span{color:var(--mute);font-size:14px}
section.s{padding:28px 0}
.sh{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.sh h2{font-size:26px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:99px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.pc{display:block;position:relative}.pc>a{display:block}
.pc .im{border-radius:20px;aspect-ratio:1/1.05;display:grid;place-items:center;transition:transform .2s}
.pc:hover .im{transform:translateY(-4px)}
.pc .im svg{width:78%;height:auto}
.pc .n{margin-top:10px;color:var(--mute);font-size:14px}
.pc .p{font-weight:700}
.story{background:var(--sky);border-radius:28px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:24px 0 48px;align-items:center}
.story h2{font-size:28px;margin-bottom:10px}
.story p{color:var(--mute);margin:0}
footer{border-top:1px solid var(--line);background:var(--card);padding:36px 0 40px;color:var(--mute);font-size:15px;text-align:left}
.ft .logo{display:inline-block;margin-bottom:14px}
.ft-i{margin:0 0 20px;line-height:1.8}
.ft-l a{display:block;color:var(--ink);padding:6px 0}
.ft-l a:hover{color:var(--blue)}
.soc{display:flex;gap:14px;margin:22px 0}
.soc a{width:54px;height:54px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;color:var(--mute);background:var(--card)}
.soc a:hover{color:var(--blue);border-color:var(--blue)}
.ft-c{border-top:1px solid var(--line);padding-top:18px;font-size:14px}
.rt{font-size:14px;margin-top:4px}.rt span{color:#f5a623;letter-spacing:1px}.rt small{color:var(--mute)}.rt.big{font-size:16px;margin:8px 0 0}
.share{display:flex;gap:10px;margin-top:18px}.share .btn{flex:1}
.rv{padding:12px 0;border-top:1px solid var(--line)}.rv small{color:var(--mute)}
.pick{display:flex;gap:2px;margin-bottom:10px}.pick button{background:none;font-size:32px;line-height:1;color:var(--line);padding:0 2px}.pick button.on{color:#f5a623}
.pd .stage .mi img{height:auto!important;max-height:560px;object-fit:contain!important}
/* product */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:32px 0 48px}
.pd .stage{border-radius:28px;display:grid;place-items:center;min-height:460px;position:relative}
.pd .stage .mi svg{width:72%;height:auto;filter:drop-shadow(0 20px 18px rgba(0,0,0,.2))}
.back{display:inline-flex;gap:6px;color:var(--mute);margin:20px 0 0;font-weight:500}
.pd h1{font-size:34px;margin:4px 0 6px}
.price{font-family:var(--fb),system-ui,sans-serif;font-size:32px;font-weight:700;color:var(--blue);margin:10px 0;letter-spacing:-.01em}
.opt{margin:22px 0 8px;font-weight:700}
.sw{display:flex;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--blue)}
.sizes{display:flex;gap:10px;flex-wrap:wrap}
.sizes button{display:inline-flex;align-items:center}
.sizes button.x{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.sw button.x{opacity:.35;cursor:not-allowed;position:relative;overflow:hidden}.sw button.x:after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:#d63c4f;transform:rotate(-45deg)}
.sizes button{background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:500}
.sizes button.on{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.qty{display:inline-flex;align-items:center;gap:12px}
.qty button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px}
.buyrow{display:flex;gap:12px;margin-top:28px}
.buyrow .btn{flex:1}
.meta{color:var(--mute);margin:16px 0 0;padding:0;list-style:none;font-size:15px}
.meta li{padding:4px 0}
/* cart / checkout */
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;padding:24px 0 48px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.box h3{margin-bottom:14px;font-size:18px}
.li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.li .th{width:64px;height:64px;border-radius:14px;display:grid;place-items:center;flex:none}
.li .th svg{width:80%}
.li .i{flex:1;min-width:0}
.li .i small{color:var(--mute);display:block}
.rm{background:none;color:var(--coral);font-size:13px;padding:0}
.row{display:flex;justify-content:space-between;padding:6px 0}
.row.t{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
label{display:block;font-weight:500;font-size:14px;margin-bottom:12px}
input,textarea{width:100%;margin-top:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pay label{flex:1;min-width:130px;margin:0;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;cursor:pointer}
.pay input{width:auto;margin:0}
.empty{text-align:center;padding:64px 20px;color:var(--mute)}
.empty h2{color:var(--ink);margin-bottom:8px}
/* orders */
.ord{margin-bottom:16px}
.oh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.badge{background:var(--sky);color:var(--blue);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;align-self:flex-start;height:fit-content;line-height:1.5;white-space:nowrap}
.badge.off{background:#fde8ea;color:#d63c4f}
.badge.ok{background:#dff3ea;color:var(--ok)}
.trk{display:flex;margin:18px 0 6px}
.trk div{flex:1;text-align:center;font-size:12px;color:var(--mute);position:relative}
.trk div:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 6px;position:relative;z-index:1}
.trk div:after{content:"";position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
.trk div:first-child:after{display:none}
.trk .d{color:var(--ink)}
.trk .d:before,.trk .d:after{background:var(--blue)}
.ok-ic{width:72px;height:72px;border-radius:50%;background:#dff3ea;color:var(--ok);display:grid;place-items:center;margin:0 auto 16px;font-size:34px}
/* profile */
.pf-head{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.av{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 26px var(--fh),sans-serif;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--sky);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font:700 20px var(--fh),sans-serif;color:var(--blue)}
.stat span{font-size:13px;color:var(--mute)}
/* wishlist + pages */
.wbtn{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
[data-wish] svg{fill:none}
[data-wish].on svg{fill:currentColor}
.wbtn.on,.btn.lbl.on{color:var(--coral)}
.lbl svg{vertical-align:-4px;margin-right:6px}
.doc{max-width:760px;margin:28px auto 56px;padding:28px}
.doc h2{font-size:28px;margin-bottom:14px}
.doc h3{font-size:17px;margin:22px 0 6px}
.doc p,.doc li{color:var(--mute);margin:0 0 8px}
.doc ul{padding-left:20px;margin:0}
.doc .row{gap:16px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:12px 20px;border-radius:99px;z-index:50;font-weight:500}
@media (max-width:860px){
 nav{display:none}.bar{justify-content:space-between}
 .hero .wrap,.pd,.two,.story{grid-template-columns:1fr}
 .hero .wrap{padding-top:32px;text-align:center}.hero p{margin:0 auto 22px}
 .grid{grid-template-columns:repeat(2,1fr);gap:14px}
 .perks{grid-template-columns:1fr}
 .pd{gap:18px;padding-top:12px}.pd .stage{min-height:340px}
 .story{padding:24px}
 body{padding-bottom:76px}
 .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
 .tabs a{flex:1;text-align:center;font-size:12px;color:var(--mute);padding:6px 0;font-weight:500}
 .tabs a.on{color:var(--blue)}.tabs svg{display:block;margin:0 auto 2px}
 .f2{grid-template-columns:1fr}
 .bar{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:10px}
 .search{order:3;flex:1 1 100%;max-width:none}
 .doc{padding:20px;margin-top:18px}
}
select{width:100%;margin-top:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.btn.sm{padding:9px 22px;font-size:14px}
.bd{position:fixed;inset:0;width:100%;background:rgba(0,0,0,.4);z-index:60;border:0;padding:0;border-radius:0}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh b{font-size:18px;letter-spacing:.06em}.dh button{background:none;font-size:28px;line-height:1;padding:2px 8px}
.db{flex:1;overflow:auto;padding:4px 22px}
.dg{padding:18px 0;border-bottom:1px solid var(--line)}.dg:last-child{border:0}
.dg h4{margin:0 0 10px;font:700 12px var(--fb),sans-serif;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.ck{display:flex;align-items:center;gap:12px;padding:8px 0;margin:0;font-size:15px;cursor:pointer}
.ck input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--blue);flex:none}
.ck em{margin-left:auto;font-style:normal;color:var(--mute);font-size:13px}
.df{display:flex;gap:12px;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.df .btn{flex:1;padding:13px}
.cts{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}.cts::-webkit-scrollbar{display:none}
.ct{flex:0 0 auto;width:96px;text-align:center;padding:6px 4px 0;border-bottom:3px solid transparent;color:var(--ink)}
.ct.on{border-color:var(--blue);color:var(--blue)}
.cti{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 8px;border-radius:50%;overflow:hidden;background:var(--sky);color:var(--mute)}
.cti img{width:100%;height:100%;object-fit:cover}.cti svg{max-width:68%;max-height:68%;height:auto}
.ctn{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:8px}
.mi{width:100%;display:grid;place-items:center}
.pd .stage .wbtn{top:14px;right:14px;width:42px;height:42px}.pd .stage .sbtn{top:64px}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.tb{width:72px;height:72px;border-radius:14px;overflow:hidden;border:2px solid transparent;padding:0;background:#fff;box-shadow:0 0 0 1px var(--line)}
.tb.on{border-color:var(--blue)}.tb img{width:100%;height:100%;object-fit:cover;display:block}
.was{color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}.offb{color:var(--coral);font-size:13px;font-weight:700;margin-top:2px}
.det{margin-bottom:24px}.det p{margin:0 0 12px;color:var(--ink);line-height:1.75}.det h4{margin:18px 0 8px;font:700 16px var(--fb),sans-serif}.det ul{margin:0 0 12px;padding-left:22px}.det li{margin:0 0 6px;color:var(--ink);line-height:1.65}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2 theme (matches mockup) ===== */
[hidden]{display:none!important}
body{background:#fff}
h1,h2,h3,.logo{font-family:var(--fh),Georgia,serif}
.btn{border-radius:99px}
.btn.line{background:none;border:1px solid var(--navy);color:var(--navy);border-radius:3px;padding:12px 20px;font-weight:500}
.btn.line:hover{background:var(--navy);color:#fff}
.top{background:var(--navy);color:#fff;font-size:12px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
.top .l,.top .r{display:flex;align-items:center;gap:8px}.top .r{gap:22px}
.top a{color:#fff;opacity:.9}.top a:hover{opacity:1}
.bar{height:76px}
.logo{font-size:34px;font-weight:600;color:var(--navy);letter-spacing:0;line-height:1;display:inline-block}
.logo{display:inline-flex;align-items:center;gap:10px}.logo img{height:44px;width:auto;max-width:120px;object-fit:contain;display:block}
.logo small{display:block;font:500 10px var(--fb),sans-serif;letter-spacing:.04em;color:var(--mute);margin-top:5px}
nav{flex:1;justify-content:center;gap:28px;margin:0}
nav>a,.dd>a{padding:6px 2px;border-radius:0;font-size:14px;color:var(--ink);font-weight:500;border-bottom:2px solid transparent}
nav a.on,nav a:hover{background:none;color:var(--navy);border-color:var(--navy)}
.dd{position:relative;display:inline-block}
.dm{display:none;position:absolute;top:calc(100% - 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:190px;box-shadow:0 12px 28px rgba(0,0,0,.1);z-index:40}
.dd:hover .dm,.dd:focus-within .dm{display:block}
.dm a{display:block;padding:9px 12px;border-radius:8px;border:0;font-size:14px;color:var(--ink);font-weight:500}
.dm a:hover{background:var(--sky);color:var(--navy)}
.icons{gap:4px}
.ib{background:none;width:40px;height:40px;color:var(--ink);border-radius:50%}
.ib:hover,.ib.on{background:none;color:var(--blue)}
.ib b{background:var(--navy);min-width:16px;height:16px;font-size:10px;top:0;right:0;padding:0 3px}
.srow{background:#fff;border-bottom:1px solid var(--line);padding:12px 0}
.srow .search{max-width:none}
.hx{position:relative;min-height:330px;display:flex;align-items:center;overflow:hidden;background:linear-gradient(100deg,var(--sky) 0%,color-mix(in srgb,var(--sky) 65%,var(--blue)) 55%,color-mix(in srgb,var(--sky) 35%,var(--blue)) 100%) center/cover}
.hx:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--sky) 92%,transparent) 0%,color-mix(in srgb,var(--sky) 60%,transparent) 45%,transparent 75%)}
.hx .wrap{position:relative;width:100%;padding-top:40px;padding-bottom:40px}
.hx .art{position:absolute;right:8%;bottom:-14px;width:min(320px,38%)}
.hx .art svg{width:100%;height:auto;filter:drop-shadow(0 18px 18px rgba(0,0,0,.2))}
.script{font:500 28px var(--fa),cursive;color:var(--navy);margin-bottom:6px}
.hx h1{font-size:clamp(36px,5vw,54px);font-weight:600;color:var(--ink);line-height:1.08;max-width:520px;margin-bottom:14px}
.hx p{max-width:390px;font-size:17px;color:var(--ink);margin:0 0 22px}
.cs{background:color-mix(in srgb,var(--sky) 55%,#fff);padding:26px 0}
.cs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.ci{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 10px;border-left:1px solid var(--line)}
.ci:first-child{border:0}
.cth{width:92px;height:92px;border-radius:50%;overflow:hidden;background:var(--sky);display:grid;place-items:center;margin-bottom:12px;color:var(--navy)}
.cth img{width:100%;height:100%;object-fit:cover}.cth svg{width:70%;height:auto}
.cth.ic{background:color-mix(in srgb,var(--sky) 70%,#fff)}.cth.ic svg{width:42px}

 const dk=col('theme_dark');set('--nl',dk&&mx(dk,'#ffffff',.04));set('--fd',dk&&mx(dk,'#000000',.28));
 [['font_heading','--fh'],['font_body','--fb'],['font_accent','--fa']].forEach(([k,v])=>{
  const p=String(o[k]||'').split('|'),n=p[0],w=p[1]||'';
  if(!/^[A-Za-z0-9 ]{2,40}$/.test(n)){rt.removeProperty(v);return}
  const id='tf-'+n.replace(/ /g,'-');
  if(!document.getElementById(id)){const u='https://fonts.googleapis.com/css2?family='+n.replace(/ /g,'+'),l=document.createElement('link');
   l.id=id;l.rel='stylesheet';l.href=u+(/^[0-9;]+$/.test(w)?':wght@'+w:'')+'&display=swap';
   l.onerror=()=>{l.onerror=null;l.href=u+'&display=swap'};document.head.appendChild(l)}
  rt.setProperty(v,"'"+n+"'")})}
const THEME_KEYS=['theme_primary','theme_dark','theme_tint','theme_accent','font_heading','font_body','font_accent'];

/* ===== Accounts: Google login, profile, order history, support ===== */
const OAUTH_RET=/[?&](code|error)=/.test(location.search);
let USER=null,CO=[],TK=[],TKM={},TKL=false,SUPERR=false,booted=false;
const GOOGLE='<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';
const fdt=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const mapOrder=r=>({id:r.id,t:new Date(r.created_at).getTime(),items:jl(r.items),total:+r.total,pay:r.payment,name:r.customer_name,addr:r.address,city:r.city,pin:r.pin,status:r.status||'Placed',pstatus:r.payment_status||''});
function myOrders(){return USER?CO:[]}
async function gLogin(){if(!sb)return toast('Login is not available right now');
 try{sessionStorage.setItem('tx_after',location.hash||'#/profile')}catch(e){}
 const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});if(error)toast(error.message)}
async function gLogout(){if(!sb)return;await sb.auth.signOut();toast('Logged out');if(location.hash!='#/')location.hash='#/'}
document.addEventListener('click',e=>{const g=e.target.closest('[data-glogin],[data-glogout]');if(!g)return;e.preventDefault();g.dataset.glogin!==undefined?gLogin():gLogout()});
function hdr(){const a=document.querySelector('a.ib[data-r=profile]');if(!a)return;if(!a.dataset.o)a.dataset.o=a.innerHTML;
 a.innerHTML=USER&&prof.avatar?`<img src="${esc(prof.avatar)}" alt="" referrerpolicy="no-referrer" style="width:30px;height:30px;border-radius:50%;object-fit:cover">`:a.dataset.o;a.setAttribute('aria-label',USER?'My account':'Login / Profile')}
async function loadProfile(){const u=USER,m=u.user_metadata||{};let r=null;
 try{const q=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();r=q.data;
  if(!q.error&&!r){const row={id:u.id,email:u.email,name:m.full_name||m.name||'',avatar:m.avatar_url||m.picture||'',phone:'',address:'',city:'',pin:''};
   const w=await sb.from('profiles').upsert(row,{onConflict:'id',ignoreDuplicates:true});if(!w.error)r=row}}catch(e){}
 r=r||{};prof={name:r.name||m.full_name||m.name||'',phone:r.phone||'',addr:r.address||'',city:r.city||'',pin:r.pin||'',email:u.email,avatar:r.avatar||m.avatar_url||m.picture||''}}
async function saveProf(p,quiet){const {error}=await sb.from('profiles').upsert({id:USER.id,email:USER.email,name:p.name,phone:p.phone,address:p.addr,city:p.city,pin:p.pin,avatar:prof.avatar||'',updated_at:new Date().toISOString()});
 if(error){if(!quiet)toast(error.message);return false}prof={...prof,name:p.name,phone:p.phone,addr:p.addr,city:p.city,pin:p.pin};return true}
async function loadOrders(){if(!USER)return false;try{const q=await sb.from('orders').select('*').eq('user_id',USER.id).order('created_at',{ascending:false});if(q.error)return false;const n=q.data.map(mapOrder),ch=JSON.stringify(n)!=JSON.stringify(CO);CO=n;return ch}catch(e){return false}}
async function loadTickets(){if(!USER)return false;try{const q=await sb.from('support_tickets').select('*').eq('user_id',USER.id).order('updated_at',{ascending:false});TKL=true;if(q.error){SUPERR=true;return true}SUPERR=false;const ch=JSON.stringify(q.data)!=JSON.stringify(TK);TK=q.data;return ch}catch(e){TKL=true;SUPERR=true;return true}}
async function loadThread(id){try{const q=await sb.from('support_messages').select('*').eq('ticket_id',id).order('created_at');if(q.error)return false;const ch=JSON.stringify(q.data)!=JSON.stringify(TKM[id]);TKM[id]=q.data;return ch}catch(e){return false}}
function accSync(r,h){const go=ch=>{if(ch&&location.hash.replace(/^#\/?/,'').split('/')[0]==r)route(1)};
 if(r=='orders'||r=='profile')loadOrders().then(go);
 if(r=='support'){loadTickets().then(go);if(h[1]&&h[1]!='new')loadThread(+h[1]).then(go)}}
async function setUser(u){const was=USER&&USER.id,now=u&&u.id;if(was==now){USER=u||null;return}
 USER=u||null;CO=[];TK=[];TKM={};TKL=false;
 if(USER){await loadProfile();await loadOrders()}else prof={};
 hdr();if(booted)route(1)}
async function authInit(){if(/^#error=/.test(location.hash)){try{const p=new URLSearchParams(location.hash.slice(1));setTimeout(()=>toast(p.get('error_description')||'Login failed. Please try again.'),600);history.replaceState(null,'',location.pathname+'#/')}catch(e){location.hash='#/'}}
 if(!sb)return;
 try{const q=new URLSearchParams(location.search);if(q.get('error_description'))setTimeout(()=>toast(q.get('error_description')),600);
  const {data}=await sb.auth.getSession();await setUser(data.session&&data.session.user)}catch(e){}
 try{sb.auth.onAuthStateChange((ev,se)=>{setTimeout(()=>setUser(se&&se.user),0)})}catch(e){}
 if(OAUTH_RET){try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}}}
function afterLogin(){if(!OAUTH_RET)return;let a=null;try{a=sessionStorage.getItem('tx_after');sessionStorage.removeItem('tx_after')}catch(e){}
 if(USER){toast('Welcome'+(prof.name?', '+prof.name.split(' ')[0]:'')+'!');if(a&&a!=location.hash&&/^#\//.test(a))location.hash=a}}

/* ----- online payments (Razorpay) ----- */
const isOnl=o=>/^Online/.test(o.pay||'');
const unpaid=o=>isOnl(o)&&o.pstatus!=='Paid'&&o.status!='Cancelled';
const payTxt=o=>isOnl(o)?(o.pstatus=='Paid'?'Paid'+(o.pay.indexOf('·')>0?' · '+esc(o.pay.split('·')[1].trim()):' online'):'Online payment pending'):esc(o.pay);
async function fnErr(r){if(r.data&&r.data.error)return r.data.error;try{if(r.error&&r.error.context&&r.error.context.json){const j=await r.error.context.json();return j.error||''}}catch(e){}return r.error?r.error.message:''}
let PAYING=false;
async function payOrder(id){
 if(PAYING)return;const o=myOrders().find(x=>x.id==id);if(!sb||!USER||!o)return toast('Please login to pay for this order');
 PAYING=true;toast('Opening payment…');
 try{
  const c=await sb.functions.invoke('razorpay-create-order',{body:{order_id:id}});
  if(c.error||!c.data||c.data.error){PAYING=false;return toast((await fnErr(c))||'Could not start payment. Please try again from My orders.')}
  if(!window.Razorpay){PAYING=false;return toast('Payment window could not load. Check your internet and try again.')}
  const d=c.data,col=(getComputedStyle(document.documentElement).getPropertyValue('--blue')||'').trim()||'#2f78a8';
  const rz=new Razorpay({key:d.key_id,amount:d.amount,currency:d.currency,order_id:d.razorpay_order_id,name:$('#lg').textContent||'Trandixo',description:'Order '+id,
   prefill:{name:prof.name||o.name||'',email:USER.email||'',contact:prof.phone||''},theme:{color:col},
   handler:async r=>{toast('Confirming payment…');
    const v=await sb.functions.invoke('razorpay-verify',{body:{order_id:id,razorpay_payment_id:r.razorpay_payment_id,razorpay_order_id:r.razorpay_order_id,razorpay_signature:r.razorpay_signature}});
    PAYING=false;toast(v.error||(v.data&&v.data.error)?'Payment received. Your order will be confirmed shortly.':'Payment successful!');
    await loadOrders();route(1)},
   modal:{ondismiss:()=>{PAYING=false;toast('Payment not completed. You can pay from My orders.')}}});
  rz.on('payment.failed',r=>{toast((r.error&&r.error.description)||'Payment failed. Please try again.')});
  rz.open();
 }catch(e){PAYING=false;toast('Payment error. Please try again.')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pay]');if(!b)return;e.preventDefault();payOrder(b.dataset.pay)});

/* ----- support ----- */
const TOPICS=['Order issue','Delivery','Return & refund','Product question','Payment','Other'];
const FAQ=[['How long does delivery take?',()=>`Orders are packed and shipped within 2–4 days. Delivery is free above ${inr(ST.free)}; below that a flat ${inr(ST.fee)} fee applies.`],['How do I track my order?',()=>'Open <a href="#/orders" style="color:var(--blue)">My orders</a> or use <a href="#/track" style="color:var(--blue)">Track order</a> with your order ID (like TDX-12345).'],['Can I return a bag?',()=>'Yes, within 7 days of delivery if it is unused and in original condition. See the <a href="#/returns" style="color:var(--blue)">return policy</a>.'],['Which payment options are available?',()=>'Pay online (UPI, Cards, Netbanking, Wallets via Razorpay) or Cash on delivery.'],['I need to change my address or cancel',()=>'Raise a request or WhatsApp us as soon as possible, before the order is shipped.']];
const stBadge=t=>`<span class="badge ${t=='Resolved'||t=='Closed'?'ok':''}">${esc(t)}</span>`;
function supportPage(id,oid){
 if(id&&id!='new')return ticketPage(+id);
 const wa=waLink(),ph=info('phone').replace(/[^\d+]/g,''),em=info('email');
 const quick=`<div class="qc">${wa?`<a href="${wa}" target="_blank" rel="noopener">WhatsApp<small>Chat with us</small></a>`:''}${ph.replace(/\D/g,'').length>=10?`<a href="tel:${esc(ph)}">Call us<small>${esc(info('hours'))}</small></a>`:''}<a href="mailto:${esc(em)}">Email<small>${esc(em)}</small></a></div>`;
 const pre=dq(oid);let left;
 if(!USER)left=`<div class="box" style="text-align:center"><h3>Raise a support request</h3><p style="color:var(--mute);margin:8px 0 16px">Login with Google to send a request, track replies and see past conversations.</p><button class="btn gbtn" data-glogin="1">${GOOGLE} Continue with Google</button></div>`;
 else if(SUPERR)left=`<div class="box"><h3>Support requests</h3><p style="color:var(--mute);margin:6px 0 0">Online requests are not available right now. Please use WhatsApp, call or email above.</p></div>`;
 else left=`<form id="tkf" class="box" style="margin-bottom:20px"><h3>New support request</h3><div class="f2"><label>Topic<select name="cat">${TOPICS.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Related order (optional)<select name="ord"><option value="">None</option>${myOrders().map(o=>`<option value="${esc(o.id)}" ${pre==o.id?'selected':''}>${esc(o.id)} · ${inr(o.total)}</option>`).join('')}</select></label></div><label>Subject<input name="subject" required maxlength="120" placeholder="e.g. Strap came loose"></label><label>Message<textarea name="msg" rows="4" required maxlength="2000" placeholder="Tell us what happened"></textarea></label><button class="btn block">Send request</button></form>
 <div class="box"><h3>My requests</h3>${!TKL?'<p style="color:var(--mute);margin:6px 0 0">Loading…</p>':TK.length?TK.map(t=>`<a class="tk" href="#/support/${t.id}"><div><b>${esc(t.subject)}</b><div style="color:var(--mute);font-size:13px">#${t.id}${t.order_id?' · '+esc(t.order_id):''} · ${fdt(t.updated_at)}</div></div>${stBadge(t.status)}</a>`).join(''):'<p style="color:var(--mute);margin:6px 0 0">No requests yet.</p>'}</div>`;
 return `<div class="wrap"><div class="sh" style="margin-top:28px"><h2>Help &amp; support</h2></div><p style="color:var(--mute);margin:0">We usually reply within one working day.</p>${quick}<div class="two"><div>${left}</div><div class="box"><h3>Quick answers</h3>${FAQ.map(([q,a])=>`<details class="fq"><summary>${q}</summary><p>${a()}</p></details>`).join('')}</div></div></div>`}
function ticketPage(id){
 if(!USER)return `<div class="wrap empty"><h2>Please login</h2><p>Login to view your support requests.</p><button class="btn gbtn" data-glogin="1">${GOOGLE} Continue with Google</button></div>`;
 const t=TK.find(x=>x.id==id);
 if(!t)return TKL?`<div class="wrap empty"><h2>Request not found</h2><a class="btn" href="#/support">Back to support</a></div>`:`<div class="wrap empty"><p>Loading…</p></div>`;
 const ms=TKM[id];
 return `<div class="wrap"><a class="back" href="#/support">← Back to support</a><div class="box" style="margin:16px 0 48px"><div class="oh"><div><h2 style="font-size:22px">${esc(t.subject)}</h2><div style="color:var(--mute);font-size:14px">#${t.id} · ${esc(t.category||'')}${t.order_id?' · Order '+esc(t.order_id):''}</div></div>${stBadge(t.status)}</div>
 <div>${ms?ms.map(m=>`<div class="msg ${m.sender=='customer'?'me':''}">${esc(m.body)}<small>${m.sender=='admin'?'Trandixo Support · ':''}${fdt(m.created_at)}</small></div>`).join(''):'<p style="color:var(--mute)">Loading messages…</p>'}</div>
 ${t.status=='Closed'?'<p style="color:var(--mute)">This request is closed. Please create a new request if you need more help.</p>':`<form id="trf" data-tid="${t.id}" style="margin-top:14px"><label>Your reply<textarea name="msg" rows="3" required maxlength="2000"></textarea></label><button class="btn">Send reply</button></form>`}</div></div>`}
document.addEventListener('submit',async e=>{
 if(e.target.id=='tkf'){e.preventDefault();if(!USER)return;const f=Object.fromEntries(new FormData(e.target)),btn=e.target.querySelector('button');btn.disabled=true;
  const {data,error}=await sb.from('support_tickets').insert({user_id:USER.id,name:prof.name||null,email:USER.email,phone:prof.phone||null,order_id:f.ord||null,category:f.cat,subject:f.subject.trim()}).select().single();
  if(error){btn.disabled=false;return toast(error.message)}
  const m=await sb.from('support_messages').insert({ticket_id:data.id,sender:'customer',body:f.msg.trim()});
  if(m.error){btn.disabled=false;return toast(m.error.message)}
  TK.unshift(data);TKM[data.id]=[{sender:'customer',body:f.msg.trim(),created_at:new Date().toISOString()}];toast('Request sent');location.hash='#/support/'+data.id}
 else if(e.target.id=='trf'){e.preventDefault();const id=+e.target.dataset.tid,body=new FormData(e.target).get('msg').trim(),btn=e.target.querySelector('button');if(!body)return;btn.disabled=true;
  const r=await sb.from('support_messages').insert({ticket_id:id,sender:'customer',body});if(r.error){btn.disabled=false;return toast(r.error.message)}
  await loadThread(id);await loadTickets();toast('Reply sent');route(1)}
});
async function boot(){
 try{applyTheme(JSON.parse(localStorage.getItem('tx_theme')||'{}'))}catch(e){}
 if(SB_URL&&SB_KEY){try{
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce',storageKey:'tx-store-auth',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
  const [p,r]=await Promise.all([sb.from('products').select('*').eq('active',true).order('id'),sb.from('settings').select('*')]);
  if(!p.error&&p.data)PRODUCTS=p.data.map(x=>({id:x.id,name:x.name,cat:x.category||'All',price:+x.price,desc:x.description||'',cols:(x.colors&&x.colors.length)?x.colors:['#2f78a8'],image_url:x.image_url,stock:x.stock,bg:tint((x.colors||[])[0])}));
  Object.assign(ST,Object.fromEntries((r.data||[]).map(x=>[x.key,x.value])));
  applyTheme(ST);try{localStorage.setItem('tx_theme',JSON.stringify(Object.fromEntries(THEME_KEYS.filter(k=>ST[k]).map(k=>[k,ST[k]]))))}catch(e){}
  CATS=jl(ST.categories).filter(c=>c&&c.name);TREND=jl(ST.trending);BANNERS=jl(ST.banners).filter(b=>b&&b.title);PI=jo(ST.product_images);OFFERS=jo(ST.offers);PD=jo(ST.product_details);PV=normPV(jo(ST.product_variants));
  ST.free=+(ST.free_delivery??ST.free);
  const rv=await sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(1000);if(rv.data)REV=rv.data;ST.fee=+(ST.delivery_fee??ST.fee);
  const ids=orders.map(o=>o.id);
  if(ids.length){const q=await sb.rpc('order_status',{ids});if(q.data){q.data.forEach(x=>{const o=orders.find(y=>y.id==x.id);if(o)o.status=x.status});save()}}
 }catch(e){}}
  let nm=ST.store_name||'Trandixo';if(nm===nm.toUpperCase())nm=nm.charAt(0)+nm.slice(1).toLowerCase();document.title=nm+' – Handmade Bags, Clothing & Accessories';$('#lg').textContent=nm;{const li=$('#lgi');if(ST.logo_image){li.src=ST.logo_image;li.hidden=false}else li.hidden=true}
 $('#ft').innerHTML=footerHTML(nm);
  await authInit();
  cart=cart.filter(i=>{const p=PRODUCTS.find(x=>x.id==i.id);return p&&vget(p,i.s)&&cols(p)[i.c]});wish=wish.filter(id=>PRODUCTS.some(p=>p.id==id));sv('tx_wish',wish);save();booted=true;route();afterLogin();
}
boot();
</script>
